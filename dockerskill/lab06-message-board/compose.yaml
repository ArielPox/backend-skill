services:
  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8086:80"
    volumes:
      - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on:
      - app

  app:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: message_board
      DB_USER: board
      DB_PASSWORD: "lab06-board-password"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: message_board
      MYSQL_USER: board
      MYSQL_PASSWORD: "lab06-board-password"
      MYSQL_ROOT_PASSWORD: "lab06-root-password"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysql -h 127.0.0.1 -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" -e "SELECT 1"'
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data: